pr: 136081
releasenote:
  text: Added support for the `+k8s:declarativeValidationNative` marker in `validation-gen`,
    enabling new API fields to use stable, declaratively-defined validation rules
    without requiring a handwritten Go fallback. Generated validation errors are now
    tagged with `.MarkDeclarativeNative()` to allow the runtime to identify natively-validated
    fields.
